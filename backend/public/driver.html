<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/auth-client.js" data-role="driver"></script>
  <script src="/delivery-proof.js" defer></script>
  <script src="/driver.js" defer></script>
  <script src="/driver-location.js" defer></script>
  <script src="/driver-route.js?v=1" defer></script>
  <title>ShopeeFood Delivery DSS — Driver App</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #23313f;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px;
      background: #18232e;
      color: white;
    }

    header strong { font-size: 23px; }

    header small {
      display: block;
      margin-top: 8px;
      color: #aebdcb;
    }

    nav {
      display: flex;
      gap: 20px;
      margin-top: 18px;
    }

    nav a { color: white; text-decoration: none; }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 18px;
    }

    h1 { margin-bottom: 8px; }
    .muted { color: #6d7c89; line-height: 1.6; }
    .error { color: #b53c3c; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .metric, .delivery-card {
      padding: 22px;
      background: white;
      border: 1px solid #e3e8ed;
      border-radius: 12px;
    }

    .metric small { color: #6d7c89; }
    .metric strong { display: block; font-size: 26px; margin-top: 12px; }

    .toolbar, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button, .action-link {
      padding: 11px 15px;
      border: 1px solid #dce2e8;
      border-radius: 7px;
      background: white;
      color: #23313f;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    button.active {
      background: #ef6b40;
      border-color: #ef6b40;
      color: white;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .deliveries {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-header h2 { margin: 0; font-size: 19px; }

    .badge {
      padding: 6px 9px;
      border-radius: 5px;
      background: #eef2f6;
      font-size: 12px;
      text-transform: capitalize;
    }

    .badge.assigned { background: #e8f1ff; color: #3667ac; }
    .badge.delivering { background: #efebff; color: #7050ac; }
    .badge.completed { background: #e8f7ef; color: #24734b; }
    .badge.failed, .badge.cancelled {
      background: #ffeded;
      color: #a84343;
    }

    dl {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 13px;
      margin: 22px 0;
      font-size: 13px;
    }

    dt { color: #6d7c89; }
    dd { margin: 0; overflow-wrap: anywhere; }

    dialog {
      width: min(650px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 25px;
      border: none;
      border-radius: 12px;
    }

    dialog::backdrop { background: #18232e88; }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #edf0f3;
    }

    th { background: #f8fafb; }

    @media (max-width: 650px) {
      .deliveries { grid-template-columns: 1fr; }
      .metrics { gap: 8px; }
      .metric { padding: 15px; }
      .metric strong { font-size: 21px; }
      dl { grid-template-columns: 1fr; gap: 7px; }
      dd { margin-bottom: 10px; }
    }
  </style>
  <link rel="stylesheet" href="/app-theme.css?v=3">
  <style id="driver-layout-fix">
  main.df-driver-main {
    width: 100%;
    max-width: 1060px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  .df-driver-main > .card,
  .df-driver-main .df-card {
    min-width: 0;
    padding: 22px;
    overflow-wrap: anywhere;
  }

  .df-driver-main > .card > h2:first-child,
  .df-driver-main .df-card > h2:first-child {
    margin-top: 0;
  }

  .df-driver-main > .card > :last-child {
    margin-bottom: 0;
  }

  @media (max-width: 700px) {
    main.df-driver-main {
      padding: 20px 14px;
    }

    .df-driver-main > .card,
    .df-driver-main .df-card {
      padding: 18px;
    }

    .df-driver-main .df-card-heading {
      flex-wrap: wrap;
    }

    .df-driver-main button {
      max-width: 100%;
      white-space: normal;
    }
  }
</style>
</head>

<body class="sf-app">
  <header>
    <strong>ShopeeFood Delivery DSS</strong>
    <small>Academic Prototype · Driver App</small>

    <nav aria-label="Main navigation">
      <a href="/driver.html">My Deliveries</a>
      <a href="/account.html">Account / Sign Out</a>
    </nav>
  </header>

  <main>
    <h1 id="driver-greeting">My Deliveries</h1>
    <p id="driver-profile" class="muted"></p>

    <section class="metrics">
      <div class="metric">
        <small>Active Deliveries</small>
        <strong id="active-count">—</strong>
      </div>
      <div class="metric">
        <small>Completed</small>
        <strong id="completed-count">—</strong>
      </div>
      <div class="metric">
        <small>COD to Collect</small>
        <strong id="pending-cod">—</strong>
      </div>
    </section>

    <div class="toolbar">
      <button id="active-tab" class="active">Active Deliveries</button>
      <button id="history-tab">Delivery History</button>
      <button id="refresh-deliveries">Refresh</button>
    </div>

    <p id="driver-message" class="muted" role="status"></p>
    <section id="deliveries" class="deliveries"></section>
  </main>

  <dialog id="delivery-dialog" aria-labelledby="delivery-title">
    <div class="dialog-header">
      <h2 id="delivery-title">Delivery Details</h2>
      <button id="close-delivery" type="button">Close</button>
    </div>
    <div id="delivery-content"></div>
  </dialog>
</body>
</html>
