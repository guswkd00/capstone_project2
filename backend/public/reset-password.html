<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set new password — ShopeeFood DSS</title>
  <link rel="stylesheet" href="/password-recovery.css">
</head>
<body>
  <header><a href="/login.html">ShopeeFood</a><span>Account Recovery</span></header>
  <main>
    <h1>Set a new password</h1>
    <p>Choose a password you have not used elsewhere.</p>
    <form id="reset-form">
      <label>New password<input id="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label>
      <label>Confirm new password<input id="confirm" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label>
      <button id="reset-button" type="submit">Update password</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <small>Use 12–200 characters without surrounding spaces. Existing sessions will be signed out.</small>
    </form>
    <a class="back" id="back-link" href="/forgot-password.html">Request a new reset link</a>
  </main>
  <footer>Academic prototype · Not an official ShopeeFood service</footer>
  <script>
    const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
    history.replaceState(null, "", location.pathname);
    const form = document.getElementById("reset-form");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirm");
    const button = document.getElementById("reset-button");
    const message = document.getElementById("message");
    let saving = false;
    if (!/^[a-f0-9]{64}$/.test(token)) {
      button.disabled = true;
      message.textContent = "This link is invalid. Request a new reset link.";
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (saving || !/^[a-f0-9]{64}$/.test(token) || !form.reportValidity()) return;
      message.className = "message";
      if (password.value !== confirm.value) { message.textContent = "The passwords do not match."; return; }
      if (password.value !== password.value.trim()) { message.textContent = "Remove surrounding spaces from your password."; return; }
      saving = true;
      const value = password.value;
      button.disabled = password.disabled = confirm.disabled = true;
      button.textContent = "Updating...";
      message.textContent = "";
      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: value }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Unable to update password.");
        password.value = confirm.value = "";
        message.textContent = result.message;
        message.className = "message success";
        button.textContent = "Password updated";
        const link = document.getElementById("back-link");
        link.href = "/login.html";
        link.textContent = "Log In with your new password";
      } catch (error) {
        message.textContent = error instanceof TypeError ? "Unable to connect. Please try again." : error.message;
        button.disabled = password.disabled = confirm.disabled = false;
        button.textContent = "Update password";
      } finally { saving = false; }
    });
  </script>
</body>
</html>
